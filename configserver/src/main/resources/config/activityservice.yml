spring:
  application:
    name: activityservice

  datasource:
    url: jdbc:mysql://localhost:3306/activity_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: prec12345
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    queue:
      name: activity.queue

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true

rabbitmq:
  exchange:
    name: fitness_direct_exchange
  routing:
    key: activity-tracking
